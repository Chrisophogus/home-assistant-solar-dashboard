  description: "Read existing cumulative Sigenergy meter, SOC, mode and plant heartbeat history through Home Assistant's read-only Recorder API from 26 October 2026 11:01:40 UTC. Archive original observations and eligible intervals in the finance-owned ledger, idempotently. Does not modify Recorder, rates or energy controls."
